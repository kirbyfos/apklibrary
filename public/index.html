<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>AI E-Library Console</title>
<style>
:root{--bg:#f1f5f9;--panel:#fff;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--side:#0f172a;--acc:#2563eb;--bad:#b91c1c}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
#side{background:var(--side);color:#cbd5e1;padding:1rem;display:flex;flex-direction:column;gap:.25rem}
.brand{color:#fff;font-weight:700;font-size:1.05rem;padding:.4rem .6rem 1rem}
#nav a{display:block;padding:.55rem .7rem;border-radius:6px;cursor:pointer;color:#cbd5e1}#nav a:hover,#nav a.on{background:#1e293b;color:#fff}
.quota{margin-top:auto;background:#1e293b;border-radius:8px;padding:.7rem;font-size:.8rem}
.meter{height:6px;background:#334155;border-radius:3px;margin-top:.4rem}.meter i{display:block;height:100%;background:#38bdf8;border-radius:3px}
.content{min-width:0}.top{display:flex;align-items:center;gap:.7rem;padding:.7rem 1.2rem;background:var(--panel);border-bottom:1px solid var(--line)}
.top h1{font-size:1.1rem;margin:0 auto 0 0}main{padding:1.2rem;max-width:1150px}
input,select,button,textarea{font:inherit;padding:.45rem .7rem;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
button{background:var(--acc);color:#fff;border-color:var(--acc);cursor:pointer}button.ghost{background:#fff;color:var(--ink);border-color:var(--line)}
button.danger{background:#fff;color:var(--bad);border-color:#fecaca}button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:3px solid #f59e0b;outline-offset:1px}
.toolbar{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1rem}.toolbar input{flex:1;min-width:200px}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
table{width:100%;border-collapse:collapse}th{background:#f8fafc;color:var(--mut);font-weight:600;text-align:left}
td,th{padding:.55rem .75rem;border-bottom:1px solid var(--line);vertical-align:middle}tr:last-child td{border-bottom:0}
.mono{font-family:ui-monospace,Consolas,monospace;color:var(--mut)}.act{white-space:nowrap;display:flex;gap:.35rem}
.tag{background:#e0e7ff;color:#3730a3;border-radius:999px;padding:.05rem .6rem;font-size:.78rem}.tag.g{background:#dcfce7;color:#166534}
a.lnk{color:var(--acc);cursor:pointer;font-weight:600}
.pager{display:flex;gap:.8rem;align-items:center;justify-content:center;margin:1rem 0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.8rem;margin-bottom:1.2rem}
.panel,.tile{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:.9rem}.tile b{display:block;font-size:1.7rem}.tile span{color:var(--mut)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1rem;margin-bottom:1rem}
form.col{display:grid;gap:.6rem}h2{font-size:1rem;margin:1.2rem 0 .6rem}.empty{padding:2rem;text-align:center;color:var(--mut)}
#toast{position:fixed;left:50%;bottom:1rem;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.5rem 1rem;border-radius:6px;display:none;z-index:20}
dialog{border:1px solid var(--line);border-radius:10px;max-width:560px;width:calc(100% - 2rem);padding:1.2rem}dialog::backdrop{background:#0f172a99}
.det{display:flex;gap:1rem}.det img{width:120px;height:170px;object-fit:contain;background:var(--bg);border-radius:6px}.det dl{margin:0}.det dt{color:var(--mut);font-size:.8rem}.det dd{margin:0 0 .5rem}
#agent{position:fixed;top:0;right:0;bottom:0;width:min(380px,100%);background:var(--panel);border-left:1px solid var(--line);display:none;flex-direction:column;z-index:10}#agent.open{display:flex}
#agent header{display:flex;justify-content:space-between;align-items:center;padding:.7rem 1rem;background:var(--side);color:#fff;font-weight:600}
#log{flex:1;overflow:auto;padding:.8rem;display:grid;gap:.5rem;align-content:start}
#log p{margin:0;padding:.5rem .7rem;border-radius:8px;white-space:pre-wrap;background:var(--bg);max-width:92%}#log p.u{background:var(--acc);color:#fff;justify-self:end}
.chips{display:flex;flex-wrap:wrap;gap:.3rem;padding:0 .8rem}.chips button{font-size:.78rem;padding:.2rem .6rem}
#cf{display:flex;gap:.4rem;padding:.7rem;border-top:1px solid var(--line)}#cf input{flex:1}
@media(min-width:1300px){.app.ag .content{margin-right:380px}}
@media(max-width:800px){.app{grid-template-columns:1fr}#side{flex-direction:row;flex-wrap:wrap;align-items:center}.brand{padding:.2rem .5rem}.quota{margin:0 0 0 auto}}
</style></head><body>
<div class="app" id="app">
<aside id="side"><div class="brand">AI E-Library</div><nav id="nav"></nav>
<div class="quota"><span>Downloads used <b id="qn"></b></span><div class="meter"><i id="qb"></i></div></div></aside>
<div class="content"><header class="top"><h1 id="title"></h1><button class="ghost" data-act="agent">AI Assistant</button><span id="who"></span></header>
<main id="main"></main></div></div>
<aside id="agent" aria-label="AI Assistant"><header>AI Assistant <button class="ghost" data-act="agent" aria-label="Close">✕</button></header>
<div id="log"><p>I can search, compare and recommend books, manage your favorites and download for you.</p></div>
<div class="chips"><button class="ghost" data-act="chip">Recommend books for me</button><button class="ghost" data-act="chip">Show my library</button><button class="ghost" data-act="chip">Find books about science</button></div>
<form id="cf"><input id="ci" placeholder="Ask the assistant" autocomplete="off" aria-label="Message"><button>Send</button></form></aside>
<dialog id="dlg"></dialog><div id="toast" role="status"></div>
<script src="app.js"></script></body></html>
